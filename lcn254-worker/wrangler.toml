name = "lcn254-api-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Uncomment to enable KV-based rate limiting (create the namespace in the
# Cloudflare dashboard first, then paste the id here):
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "YOUR_KV_NAMESPACE_ID"

[vars]
# Public variables (non-sensitive) go here.
# ALLOWED_ORIGIN is set here; GEMINI_API_KEY, MPESA_* credentials, and
# STRIPE_SECRET_KEY are added as secrets via `wrangler secret put`
# (never put secrets in this file). PAYMENT_SECRET is no longer used —
# the client-side "manual payment override" it supported was removed as
# a security fix (it let anyone skip payment verification).
ALLOWED_ORIGIN = "https://lcn254.site"

# Project intake form (POST /intake). RESEND_API_KEY is a secret:
#   wrangler secret put RESEND_API_KEY
# INTAKE_FROM must be an address on a domain verified in Resend.
INTAKE_TO = "contact@lcn254.site"
INTAKE_FROM = "LCN254 Website <intake@lcn254.site>"
